[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-aws-project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "boto3",
    "sagemaker",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]